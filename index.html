<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Gửi anh iu 19/11 💙</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04020d;--blue:#7fd8ff;--pink:#ff7ad9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color-scheme:dark;-webkit-tap-highlight-color:transparent}
#neb{position:fixed;inset:-25%;background:radial-gradient(40% 35% at 25% 30%,rgba(80,60,255,.4),transparent 70%),radial-gradient(35% 40% at 75% 65%,rgba(255,60,170,.3),transparent 70%),radial-gradient(30% 30% at 55% 12%,rgba(40,170,255,.32),transparent 70%),radial-gradient(30% 30% at 20% 85%,rgba(150,60,255,.28),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:rotate(14deg) scale(1.18)}}
#fx{position:fixed;inset:0;width:100%;height:100%}
#stage{position:fixed;inset:0;perspective:640px;opacity:0;transition:opacity 2.5s;pointer-events:none}
#stage.on{opacity:1}
#tunnel{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.nw{position:absolute;white-space:nowrap;font:700 26px Quicksand,sans-serif;text-shadow:0 0 6px currentColor,0 0 20px currentColor;will-change:transform,opacity}
.ph{position:absolute;width:112px;height:150px;border:5px solid #fff;border-radius:8px;background:#222 center/cover;box-shadow:0 0 24px var(--g);will-change:transform,opacity}
#msg{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 9%;font:400 clamp(22px,6vw,34px)/1.6 Pacifico,cursive;color:#c4ecff;text-shadow:0 0 14px rgba(110,200,255,.9);opacity:0;transition:opacity .7s;pointer-events:none;z-index:3}
#msg.show{opacity:1}
.bh{display:block;font-size:1.5em;animation:beat 1s infinite;filter:drop-shadow(0 0 14px #3aa8ff)}
@keyframes beat{50%{transform:scale(1.28)}}
#cap{position:fixed;left:0;right:0;bottom:calc(11% + env(safe-area-inset-bottom,0px));text-align:center;padding:0 8%;font:700 clamp(17px,4.6vw,24px)/1.5 Quicksand,sans-serif;color:#fff;text-shadow:0 0 10px var(--blue),0 0 22px var(--pink);opacity:0;transition:opacity .7s;z-index:3;pointer-events:none}
#cap.show{opacity:1}
#fin{position:fixed;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));text-align:center;font:400 clamp(26px,7.5vw,44px)/1.4 Pacifico,cursive;color:#fff;text-shadow:0 0 12px var(--blue),0 0 30px var(--pink);opacity:0;transition:opacity 2s;z-index:4;pointer-events:none}
#fin small{display:block;margin-top:8px;font:600 14px Quicksand,sans-serif;color:#ffffffaa;text-shadow:none}
#fin.on{opacity:1}
.hrt{position:fixed;bottom:-50px;animation:up linear forwards;z-index:2;pointer-events:none;filter:drop-shadow(0 0 8px currentColor)}
@keyframes up{to{transform:translate(var(--dx),-118vh) rotate(var(--r));opacity:0}}
#gift{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(4,2,13,.55);font:400 clamp(20px,5.5vw,30px)/1.5 Pacifico,cursive;color:#c4ecff;text-shadow:0 0 14px #3aa8ff;transition:opacity 1s;text-align:center;padding:0 10%;cursor:pointer}
#gift .bh{font-size:78px}
#gift small{font:600 13px Quicksand,sans-serif;color:#ffffff88;text-shadow:none}
#gift.off{opacity:0;pointer-events:none}
#mosaic{position:fixed;left:50%;top:44%;width:0;height:0;z-index:2;pointer-events:none;filter:drop-shadow(0 0 16px rgba(90,175,255,.75))}
.tile{position:absolute;border-radius:6px;background:#222 center/cover;box-shadow:0 0 10px rgba(255,140,220,.7);transition:transform 1.8s cubic-bezier(.2,.8,.2,1),opacity 1.2s;opacity:0}
#mosaic.beat{animation:lub 1.3s ease-in-out infinite}
@keyframes lub{0%,100%{transform:scale(1)}14%{transform:scale(1.07)}28%{transform:scale(1)}42%{transform:scale(1.13)}70%{transform:scale(1)}}
#fin small{max-width:84%;margin-left:auto;margin-right:auto;line-height:1.6}
#again{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:8;border:1px solid #ffffff44;background:#ffffff14;color:#fff;border-radius:20px;padding:7px 14px;font:600 13px Quicksand,sans-serif;opacity:0;pointer-events:none;transition:opacity 1s}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:8;border:1px solid #ffffff44;background:#ffffff14;color:#fff;border-radius:20px;padding:6px 12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity 1s}
#mute.on{opacity:.85;pointer-events:auto}
#again.on{opacity:.85;pointer-events:auto}
#pup{position:fixed;bottom:calc(5% + env(safe-area-inset-bottom,0px));left:-80px;z-index:6;font-size:54px;line-height:1;transition:left 5.5s linear,opacity 1s;opacity:0;pointer-events:none}
#pup.on{opacity:1}
#dog{display:inline-block;transform:scaleX(-1);animation:hop .45s ease-in-out infinite;filter:drop-shadow(0 0 12px #7fd8ff)}
#pup.sit #dog{animation:wag 1.1s ease-in-out infinite}
@keyframes hop{50%{transform:scaleX(-1) translateY(-10px)}}
@keyframes wag{50%{transform:scaleX(-1) rotate(9deg)}}
#bub{position:absolute;bottom:100%;left:50%;width:210px;margin:0 0 8px -105px;text-align:center;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid #ffffff55;font:600 14px/1.4 Quicksand,sans-serif;color:#fff;opacity:0;transition:opacity .5s}
#bub.show{opacity:1}
#trail span{position:fixed;bottom:calc(3% + env(safe-area-inset-bottom,0px));font-size:18px;transform:rotate(90deg);animation:fadep 5s forwards;z-index:5;pointer-events:none}
@keyframes fadep{from{opacity:.85}to{opacity:0}}
#letter{position:fixed;left:50%;top:calc(6% + env(safe-area-inset-top,0px));bottom:30%;width:min(88vw,520px);box-sizing:border-box;transform:translateX(-50%) translateY(20px);padding:22px;border-radius:18px;background:linear-gradient(160deg,rgba(40,30,90,.6),rgba(10,10,40,.68));border:1px solid rgba(160,210,255,.35);box-shadow:0 0 40px rgba(90,150,255,.35),inset 0 0 30px rgba(255,255,255,.04);overflow-y:auto;opacity:0;transition:opacity 1.5s,transform 1.5s;z-index:5;font:400 clamp(16px,4.3vw,20px)/1.8 Pacifico,cursive;color:#e9f5ff;text-shadow:0 0 8px rgba(120,190,255,.55);scrollbar-width:none;pointer-events:none}
#letter::-webkit-scrollbar{display:none}
#letter.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.lp{margin-bottom:14px}
#doors{position:fixed;left:0;right:0;top:calc(13% + env(safe-area-inset-top,0px));display:flex;justify-content:center;gap:4vw;z-index:5;opacity:0;pointer-events:none;transition:opacity 1.2s}
#doors.on{opacity:1;pointer-events:auto}
.door{position:relative;width:min(24vw,118px);height:min(38vh,230px);border:3px solid var(--c);border-radius:999px 999px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.05),var(--c2));box-shadow:0 0 22px var(--c),inset 0 0 26px var(--c2);display:flex;justify-content:center;padding-top:16px;box-sizing:border-box;cursor:pointer;animation:flt 3s ease-in-out infinite;transition:transform .8s,opacity .8s,box-shadow .8s}
.door i{font-style:normal;font-size:30px;filter:drop-shadow(0 0 8px var(--c))}
.d1{--c:#5fc4ff;--c2:rgba(60,150,255,.35)}.d2{--c:#ff7ad9;--c2:rgba(255,80,190,.35);animation-delay:-1s}.d3{--c:#b79bff;--c2:rgba(150,110,255,.35);animation-delay:-2s}
@keyframes flt{50%{transform:translateY(-10px)}}
#doors.picked .door:not(.sel){opacity:0;transform:scale(.85)}
#doors.picked .sel{transform:scale(1.15);box-shadow:0 0 60px var(--c),inset 0 0 60px #fff;animation:none}
#dh{position:absolute;top:100%;left:0;right:0;margin-top:14px;text-align:center;font:600 14px Quicksand,sans-serif;color:#ffffffbb}
#flash{position:fixed;left:50%;top:30%;width:40px;height:40px;margin:-20px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(150,210,255,.9) 40%,transparent 70%);z-index:7;pointer-events:none;opacity:0}
#flash.go{animation:fl 1.4s ease-in forwards}
@keyframes fl{0%{opacity:0;transform:scale(1)}30%{opacity:1}100%{opacity:0;transform:scale(60)}}
#big{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8%;font:400 clamp(32px,9.5vw,56px)/1.45 Pacifico,cursive;color:#fff;text-shadow:0 0 12px #7fd8ff,0 0 32px #ff7ad9,0 0 64px #7fd8ff;background:radial-gradient(circle at 50% 45%,rgba(70,45,160,.7),rgba(4,2,13,.84));opacity:0;pointer-events:none;transition:opacity .6s}
#big.show{opacity:1}
#big span{display:block;transform:scale(.5);transition:transform 1s cubic-bezier(.2,1.6,.3,1)}
#big.show span{transform:scale(1)}
#pbox{position:fixed;left:50%;bottom:calc(3% + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);width:min(90vw,440px);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transition:opacity .8s,transform .8s;z-index:7;pointer-events:none}
#pbox.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#pb{min-height:60px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.15);border:1px solid #ffffff55;backdrop-filter:blur(3px);font:600 15px/1.5 Quicksand,sans-serif;color:#fff;text-align:center;opacity:0;transition:opacity .4s}
#pb.show{opacity:1}
#pch{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:40px}
#pch button{border:1.5px solid #7fd8ff;background:rgba(95,196,255,.2);color:#fff;border-radius:20px;padding:9px 16px;font:700 14px Quicksand,sans-serif;cursor:pointer}
#pnd{font-size:66px;line-height:1;animation:bob .7s ease-in-out infinite;filter:drop-shadow(0 0 12px #fff)}
#pbox.dance #pnd{animation:dnc .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes dnc{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg) translateY(-14px)}}
</style>
</head>
<body>
<div id="neb"></div>
<canvas id="fx"></canvas>
<div id="stage"><div id="tunnel"></div></div>
<div id="msg"><span class="bh">💙</span><span id="t"></span></div>
<div id="cap"></div>
<div id="mosaic"></div>
<div id="letter"><div id="lt"></div></div>
<div id="trail"></div>
<div id="doors"><div class="door d1"><i>🌙</i></div><div class="door d2"><i>⭐</i></div><div class="door d3"><i>🪐</i></div><div id="dh">Chạm vào một cánh cửa nha 🐾</div></div>
<div id="flash"></div>
<div id="big"><span></span></div>
<div id="pbox"><div id="pb"></div><div id="pch"></div><div id="pnd">🐼</div></div>
<div id="pup"><div id="bub"></div><span id="dog">🐕</span></div>
<div id="fin">Happy Men’s Day, anh iu 💙<small id="fs"></small></div>
<button id="mute" onclick="event.stopPropagation();togMute(this)">🔊</button>
<button id="again" onclick="event.stopPropagation();if(!busy)play()">↻ Xem lại</button>
<div id="gift"><span class="bh">💙</span>Chạm để mở quà nha anh iu<small>(bật âm lượng nhẹ nhẹ nha)</small></div>

const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cv=$('fx'),c=cv.getContext('2d');let W,H,warp=.25,heartA=0;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);
// photo classes (defined once)
const st=document.createElement('style');
st.textContent=CONFIG.photos.map((p,i)=>`.p${i}{background-image:url(${p})}`).join('');document.head.appendChild(st);
// warp stars
const col=()=>{const q=Math.random();return q<.45?'170,220,255':q<.8?'255,160,230':'255,255,255'};
const S=Array.from({length:260},()=>({a:rnd(0,6.283),r:Math.random(),s:rnd(.4,1.5),c:col()}));
const shoot=[];
// heart particles
const HP=Array.from({length:620},()=>{const t=rnd(0,6.283),k=Math.random()<.7?rnd(.82,1):Math.sqrt(Math.random());return{t,k,z:rnd(-1,1),h:rnd(190,330),tw:rnd(0,6.28)}});
const hx=t=>16*Math.sin(t)**3,hy=t=>-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
let last=performance.now(),tm=0;
function draw(now){
 const dt=Math.min(now-last,50);last=now;tm+=dt;
 c.clearRect(0,0,W,H);const cx=W/2,cy=H/2,mr=Math.hypot(W,H)/2;
 for(const s of S){
  s.r+=dt*.00011*s.s*(1+warp*4)*(.3+s.r*2);
  if(s.r>1){s.r=rnd(0,.05);s.a=rnd(0,6.283)}
  const r1=s.r*mr,r0=r1*(1-.05*warp-.01),ca=Math.cos(s.a),sa=Math.sin(s.a);
  c.strokeStyle=`rgba(${s.c},${Math.min(1,s.r*1.4)})`;c.lineWidth=.4+s.r*2;
  c.beginPath();c.moveTo(cx+ca*r0,cy+sa*r0);c.lineTo(cx+ca*r1,cy+sa*r1);c.stroke();
 }
 if(Math.random()<.012)shoot.push({x:rnd(0,W),y:rnd(0,H*.5),vx:rnd(-.9,-.5)*dt*8,vy:rnd(.3,.6)*dt*8,l:1});
 for(let i=shoot.length-1;i>=0;i--){const q=shoot[i];q.x+=q.vx;q.y+=q.vy;q.l-=.02;
  const g=c.createLinearGradient(q.x,q.y,q.x-q.vx*9,q.y-q.vy*9);g.addColorStop(0,`rgba(255,255,255,${q.l})`);g.addColorStop(1,'rgba(255,255,255,0)');
  c.strokeStyle=g;c.lineWidth=2;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(q.x-q.vx*9,q.y-q.vy*9);c.stroke();if(q.l<=0)shoot.splice(i,1)}
 if(heartA>0){
  const sc=Math.min(W,H)/38*(1+.05*Math.sin(tm/260)),ry=tm/1400,cr=Math.cos(ry),sr=Math.sin(ry),oy=cy-H*.08;
  for(const p of HP){
   const x=hx(p.t)*p.k,y=hy(p.t)*p.k,z=p.z*6,xr=x*cr+z*sr,zr=-x*sr+z*cr;
   const a=heartA*(.45+.55*Math.abs(Math.sin(tm/420+p.tw)))*(.6+.4*(zr+16)/32);
   c.fillStyle=`hsla(${p.h},100%,72%,${a})`;c.shadowColor=`hsl(${p.h},100%,65%)`;c.shadowBlur=8;
   c.beginPath();c.arc(cx+xr*sc,oy+y*sc,1+(zr+16)/16,0,6.283);c.fill();
  }c.shadowBlur=0}
 c.textAlign='center';
 for(let i=B.length-1;i>=0;i--){const p=B[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.992;p.l-=p.d;if(p.l<=0){B.splice(i,1);continue}
  c.fillStyle=`hsla(${p.h},100%,72%,${p.l})`;c.shadowColor=`hsl(${p.h},100%,65%)`;c.shadowBlur=10;c.font=p.sz+'px sans-serif';c.fillText(p.t,p.x,p.y)}
 c.shadowBlur=0;
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
// tunnel
const T=$('tunnel'),DEPTH=2800,items=[];let running=false,spin=0,tl=performance.now();
function place(it,z){const m=Math.min(innerWidth,innerHeight),a=rnd(0,6.283),r=m*rnd(.3,1.15);it.x=Math.cos(a)*r*1.1;it.y=Math.sin(a)*r*1.3;it.z=z;it.rot=rnd(-14,14)}
for(let i=0;i<100;i++){
 const el=document.createElement('div'),ph=i%4===0;
 if(ph){el.className='ph p'+((i/4|0)%CONFIG.photos.length);el.style.setProperty('--g',Math.random()<.5?'rgba(110,200,255,.85)':'rgba(255,122,217,.85)')}
 else{el.className='nw';el.textContent=CONFIG.words[i%CONFIG.words.length];el.style.color=['#7fe8ff','#ff7ad9','#b9a2ff','#fff'][i%4]}
 T.appendChild(el);const it={el};place(it,-rnd(0,DEPTH));items.push(it)}
function loop(t){const dt=Math.min(t-tl,50);tl=t;spin+=dt*.004;T.style.transform=`rotateZ(${spin}deg)`;
 for(const it of items){it.z+=dt*.38;if(it.z>430)place(it,-DEPTH);
  const o=Math.min(1,(it.z+DEPTH)/700)*Math.min(1,(430-it.z)/260);
  it.el.style.opacity=Math.max(0,o);
  it.el.style.transform=`translate3d(${it.x}px,${it.y}px,${it.z}px) translate(-50%,-50%) rotateZ(${it.rot-spin}deg)`}
 if(running)requestAnimationFrame(loop)}
// hearts rain
const HE=['💙','💙','🩵','💜','💗','💖','✨','♥'];
function heart(){const h=document.createElement('div');h.textContent=HE[Math.random()*HE.length|0];
 h.className='hrt';h.style.left=rnd(0,96)+'vw';h.style.fontSize=rnd(14,46)+'px';h.style.color=['#3aa8ff','#ff4d8d','#b57bff'][Math.random()*3|0];
 h.style.setProperty('--dx',rnd(-60,60)+'px');h.style.setProperty('--r',rnd(-40,40)+'deg');h.style.animationDuration=rnd(5,9)+'s';
 document.body.appendChild(h);setTimeout(()=>h.remove(),9500)}

// ===== finale =====
let bgm,bgm2,cur;const B=[];let tiles=[],beatT,finalOn=false,ac;
function burst(x,y,n=60,spd=1){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(.6,5.2)*spd;B.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,l:1,d:rnd(.007,.018),h:rnd(190,330),t:Math.random()<.5?'♥':'•',sz:rnd(12,26)})}}
function thump(f,v){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.frequency.setValueAtTime(f*1.7,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.35)}catch(e){}}
function lubdub(){setTimeout(()=>thump(75,.5),90);setTimeout(()=>thump(62,.38),450);try{navigator.vibrate&&navigator.vibrate([45,110,70])}catch(e){}}
function buildHeart(){
 const M=$('mosaic');M.innerHTML='';tiles=[];
 const cols=12,rows=11,cell=Math.min(W*.92,H*.6)/cols;let n=0;
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
  const x=(i+.5)/cols*2.6-1.3,y=1.3-(j+.5)/rows*2.5;
  if((x*x+y*y-1)**3-x*x*y**3>0)continue;
  const el=document.createElement('div');el.className='tile p'+(n++*7%CONFIG.photos.length);
  const s=cell*1.1;el.style.width=el.style.height=s+'px';el.style.left=el.style.top=(-s/2)+'px';
  const px=(i+.5-cols/2)*cell,py=(j+.5-rows/2)*cell;
  el.style.transform=`translate(${rnd(-1,1)*W}px,${rnd(-1,1)*H}px) scale(.2) rotate(${rnd(-90,90)}deg)`;
  M.appendChild(el);tiles.push({el,px,py})}
 void M.offsetWidth;
 for(const t of tiles){t.el.style.transitionDelay=rnd(0,1.6)+'s';t.el.style.opacity=1;t.el.style.transform=`translate(${t.px}px,${t.py}px)`}
}
function explode(){for(const t of tiles){t.el.style.transitionDelay=rnd(0,.25)+'s';t.el.style.opacity=0;t.el.style.transform=`translate(${t.px*5}px,${t.py*5}px) scale(.1) rotate(${rnd(-200,200)}deg)`}}
async function say(txt,ms){const cap=$('cap');cap.textContent=txt;cap.classList.add('show');await sleep(ms);cap.classList.remove('show');await sleep(600)}
async function bubble(txt,ms){const b=$('bub');b.textContent=txt;b.classList.add('show');await sleep(ms);b.classList.remove('show');await sleep(400)}
function flashAt(x,y){const f=$('flash');f.classList.remove('go');f.style.left=x+'px';f.style.top=y+'px';void f.offsetWidth;f.classList.add('go')}
async function puppyPhase(){
 const p=$('pup'),L=$('letter'),D=$('doors'),ds=[...D.querySelectorAll('.door')];
 void p.offsetWidth;p.style.transition='';p.classList.add('on');p.style.left='calc(50% - 30px)';
 const pw=setInterval(()=>{const r=p.getBoundingClientRect(),s=document.createElement('span');s.textContent='🐾';s.style.left=(r.left+8)+'px';$('trail').appendChild(s);setTimeout(()=>s.remove(),5000)},380);
 await sleep(3000);await bubble('Gâu! Anh Long ơi, đi theo em nha 💙',3000);
 clearInterval(pw);p.classList.add('sit');
 D.classList.add('on');await bubble('Phía trước có ba cánh cửa. Anh chọn một cửa đi nè 🐾',3600);
 const idx=await new Promise(res=>{ds.forEach((d,k)=>d.onclick=()=>res(k));setTimeout(()=>res(1),30000)});
 ds.forEach(d=>d.onclick=null);ds[idx].classList.add('sel');D.classList.add('picked');
 const r=ds[idx].getBoundingClientRect();flashAt(r.left+r.width/2,r.top+r.height/2);
 await sleep(1100);
 await bigSay('Mệt ghê,<br>cửa nào thì cũng vào<br>tim em thoai 💙',5200);
 D.classList.remove('on');L.classList.add('on');await sleep(1500);
 for(const para of CONFIG.letter){const d=document.createElement('div');d.className='lp';$('lt').appendChild(d);
  for(const ch of Array.from(para)){d.textContent+=ch;L.scrollTop=L.scrollHeight;await sleep(38)}
  await sleep(900)}
 await sleep(1200);await bubble('Gâu! Còn bất ngờ nữa nè, đi tiếp thôi anh iu 🐾',3000);
 L.classList.remove('on');p.classList.remove('on');warp=4;flashAt(W/2,H/2);await sleep(1300);
}

function togMute(b){const m=!(bgm&&bgm.muted);[bgm,bgm2].forEach(a=>{if(a)a.muted=m});b.textContent=m?'🔇':'🔊'}
function fadeTo(a,v,ms){if(!a)return;const s=a.volume,t0=performance.now(),iv=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=Math.max(0,Math.min(1,s+(v-s)*k));if(k>=1)clearInterval(iv)},50)}
function music2(){if(!CONFIG.music2)return;if(!bgm2){bgm2=new Audio(CONFIG.music2);bgm2.loop=true;bgm2.volume=0;bgm2.muted=!!(bgm&&bgm.muted)}
 fadeTo(bgm,0,2000);setTimeout(()=>{if(bgm&&cur===bgm2)bgm.pause()},2100);bgm2.currentTime=0;bgm2.play().catch(()=>{});cur=bgm2;fadeTo(bgm2,.6,2000)}
async function bigSay(html,ms){const b=$('big');b.firstChild.innerHTML=html;b.classList.add('show');await sleep(ms);b.classList.remove('show');await sleep(700)}
const PANDA=[
 {say:"Ê ê, Long! Tui là Gấu Trúc, nhân viên bảo vệ vũ trụ tình yêu này. Cho tui hỏi nhanh vài câu nha 🐼",ch:[["Ok luôn","Ngoan! Vậy mình vào việc nha."],["Ai đó??","Hổng cần biết! Tui là fan cứng của hai người thôi 🐼"]]},
 {say:"Xem hết “bộ phim” này mà không rớt tí nước mắt nào hả? Khai thật đi!",ch:[["Hơi xúc động","Xúc động là đúng rồi, người ta làm quà cho mà!"],["Đàn ông mạnh mẽ","Ờ ờ mạnh mẽ… mà sao mắt anh đỏ đỏ vậy 👀"]]},
 {say:"Chấm điểm món quà nè, mấy trên 10?",ch:[["10/10","Chuẩn bài! Nhớ nói cho người ta nghe nha."],["11/10 vì có cún","Cún nghe được chắc vẫy đuôi tít luôn 🐕"]]},
 {say:"Hỏi thiệt, cảm xúc của anh lúc này là gì?",ch:[["Vui","Vui là tốt! Giữ nguyên nha."],["Cảm động","Hiểu rồi, tim anh đang đập mạnh hơn bình thường á."],["Nhớ em rồi","Ui, câu này nói trực tiếp mới đã á!"]]},
 {say:"Nhiệm vụ cuối nè: nhớ nói với iu của anh về cảm xúc của anh lúc này nha! Đừng giữ trong lòng 🐼💙",ch:[["Biết rồi, đi nói liền!","Giỏi lắm! Giờ nhảy với tui một bài đã 🕺"]]}
];
async function pandaPhase(){
 const P=$('pbox'),pb=$('pb'),ch=$('pch');P.classList.add('on');await sleep(1000);
 for(const s of PANDA){
  pb.textContent=s.say;pb.classList.add('show');ch.innerHTML='';
  const k=await new Promise(res=>{s.ch.forEach(([lab],i)=>{const b=document.createElement('button');b.textContent=lab;b.onclick=()=>res(i);ch.appendChild(b)});setTimeout(()=>res(0),40000)});
  ch.innerHTML='';pb.textContent=s.ch[k][1];burst(W/2,H*.62,28,.6);await sleep(2800)}
 pb.classList.remove('show');P.classList.add('dance');
 for(let i=0;i<7;i++){burst(rnd(W*.2,W*.8),rnd(H*.3,H*.7),40);await sleep(900)}
 P.classList.remove('dance','on');await sleep(900)}

async function finale(){
 music2();$('stage').classList.remove('on');warp=.4;buildHeart();
 setTimeout(()=>{running=false},2800);await sleep(3600);
 if(cur)cur.volume=.3;$('mosaic').classList.add('beat');lubdub();beatT=setInterval(lubdub,1300);
 await say('Mỗi nhịp đập này là một lần em nghĩ về anh 💙',5200);
 await say('Trái tim này, em để dành cho anh.',4600);
 clearInterval(beatT);if(cur)cur.volume=.6;explode();
 for(let k=0;k<9;k++)setTimeout(()=>{burst(rnd(W*.15,W*.85),rnd(H*.12,H*.5),70);thump(95,.3)},k*260);
 await sleep(1900);warp=1;
 const g=setInterval(()=>{heartA=Math.min(1,heartA+.02);if(heartA>=1)clearInterval(g)},40);
 $('fin').classList.add('on');await sleep(4200);$('fin').classList.remove('on');await sleep(900);await pandaPhase();$('fs').textContent='Chạm vào màn hình để thả tim ✨';$('fin').classList.add('on');
 $('again').classList.add('on');finalOn=true;
}
// sequence
let busy=false,hT,cT;
async function type(line){const t=$('t');t.textContent='';$('msg').classList.add('show');
 for(const ch of Array.from(line)){t.textContent+=ch;await sleep(45)}
 await sleep(1200);$('msg').classList.remove('show');await sleep(800)}
async function play(){
 if(busy)return;busy=true;running=false;heartA=0;warp=.25;
 clearInterval(hT);clearInterval(cT);clearInterval(beatT);finalOn=false;B.length=0;$('mosaic').innerHTML='';$('mosaic').classList.remove('beat');$('again').classList.remove('on');$('letter').classList.remove('on');$('lt').innerHTML='';$('pup').classList.remove('on','sit');$('pup').style.transition='none';$('pup').style.left='-80px';$('trail').innerHTML='';$('bub').classList.remove('show');$('big').classList.remove('show');$('pbox').classList.remove('on','dance');if(bgm2)bgm2.pause();if(bgm){bgm.currentTime=0;bgm.volume=.6;cur=bgm;bgm.play().catch(()=>{})}$('doors').classList.remove('on','picked');$('doors').querySelectorAll('.door').forEach(d=>{d.classList.remove('sel');d.onclick=null});
 ['stage','fin','cap'].forEach(i=>$(i).classList.remove('on','show'));
 await sleep(900);
 for(const l of CONFIG.intro)await type(l);
 await puppyPhase();warp=1.1;running=true;tl=performance.now();requestAnimationFrame(loop);$('stage').classList.add('on');
 hT=setInterval(heart,260);
 await sleep(20000);clearInterval(hT);await finale();busy=false}
addEventListener('pointerdown',e=>{if(finalOn)burst(e.clientX,e.clientY,34,.7)});
$('gift').addEventListener('click',()=>{try{if(CONFIG.music){bgm=new Audio(CONFIG.music);cur=bgm;bgm.loop=true;bgm.volume=.6;bgm.play().catch(()=>{});$('mute').classList.add('on')}if(CONFIG.music2){bgm2=new Audio(CONFIG.music2);bgm2.loop=true;bgm2.volume=0;bgm2.play().then(()=>{bgm2.pause();bgm2.currentTime=0}).catch(()=>{})}}catch(e){}try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}$('gift').classList.add('off');play()});
</script>
